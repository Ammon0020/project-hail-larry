name: rust-ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Pin the toolchain via rust-toolchain.toml (channel 1.92.0).
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: cargo fmt (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy -D warnings (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # build.rs requires web/dist/index.html (SPA embed). CI uses a stub so
      # Node/npm is not required for lint/test; release+SPA smoke is deferred.
      - name: Ensure SPA embed marker
        run: |
          mkdir -p web/dist
          if [ ! -f web/dist/index.html ]; then
            printf '%s\n' '<!doctype html><title>Local Agent</title>' > web/dist/index.html
          fi
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: cargo test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure SPA embed marker
        run: |
          mkdir -p web/dist
          if [ ! -f web/dist/index.html ]; then
            printf '%s\n' '<!doctype html><title>Local Agent</title>' > web/dist/index.html
          fi
      - name: cargo test
        run: cargo test --all-targets --locked

  build-macos:
    name: cargo build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure SPA embed marker
        run: |
          mkdir -p web/dist
          if [ ! -f web/dist/index.html ]; then
            printf '%s\n' '<!doctype html><title>Local Agent</title>' > web/dist/index.html
          fi
      - name: cargo build
        run: cargo build --locked

  build-test-windows:
    name: cargo build + test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure SPA embed marker
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path web\dist | Out-Null
          if (-not (Test-Path web\dist\index.html)) {
            Set-Content -Path web\dist\index.html -Value "<!doctype html><title>Local Agent</title>"
          }
      - name: cargo build
        run: cargo build --locked
      - name: cargo test
        run: cargo test --all-targets --locked
