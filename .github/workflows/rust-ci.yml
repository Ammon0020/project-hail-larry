name: rust-ci

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref so a rapid second push doesn't
# queue behind a stale first run. PR runs and main runs are grouped
# separately so an open PR doesn't cancel main (or vice versa).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pin the toolchain via rust-toolchain.toml (channel 1.92.0).
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: cargo fmt (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy -D warnings (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # build.rs requires web/dist/index.html (SPA embed). Lint/test jobs use a
      # stub so Node/npm is not required; real SPA embed is covered by
      # release-macos / release-windows below.
      - name: Ensure SPA embed marker
        run: |
          mkdir -p web/dist
          if [ ! -f web/dist/index.html ]; then
            printf '%s\n' '<!doctype html><title>Local Agent</title>' > web/dist/index.html
          fi
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: cargo test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure SPA embed marker
        run: |
          mkdir -p web/dist
          if [ ! -f web/dist/index.html ]; then
            printf '%s\n' '<!doctype html><title>Local Agent</title>' > web/dist/index.html
          fi
      - name: Build mockagent (Rust)
        run: |
          cargo build --bin mockagent --locked
          cp target/debug/mockagent /tmp/mockagent
      - name: cargo test
        run: cargo test --all-targets --locked

  # Black-box API contract suite (feature-gated; not part of --all-targets).
  # Builds the debug binary once, then runs the runner serially against it so a
  # wire-breaking Rust change fails CI. Ignored cases (documented in
  # tests/contract/README.md): rest_agents_autodetect_ok, rest_mcp_put_bad_body.
  contract:
    name: contract suite (Linux)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure SPA embed marker
        run: |
          mkdir -p web/dist
          if [ ! -f web/dist/index.html ]; then
            printf '%s\n' '<!doctype html><title>Local Agent</title>' > web/dist/index.html
          fi
      - name: Build debug binary
        run: cargo build --bin local_agent --locked
      - name: Contract suite (Rust backend)
        run: |
          CONTRACT_BACKEND=rust CONTRACT_BINARY=./target/debug/local_agent \
            cargo test -q --test contract_runner --features contract -- --test-threads=1

  # macos-latest = Apple Silicon (arm64); macos-15-intel = Intel (x86_64).
  # Build-verify on both; full SPA smoke runs only on release-macos (arm64)
  # below. Intel release binaries come from the tag-triggered release.yml.
  build-macos:
    name: cargo build (macOS ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure SPA embed marker
        run: |
          mkdir -p web/dist
          if [ ! -f web/dist/index.html ]; then
            printf '%s\n' '<!doctype html><title>Local Agent</title>' > web/dist/index.html
          fi
      - name: cargo build
        run: cargo build --locked

  build-test-windows:
    name: cargo build + test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure SPA embed marker
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path web\dist | Out-Null
          if (-not (Test-Path web\dist\index.html)) {
            Set-Content -Path web\dist\index.html -Value "<!doctype html><title>Local Agent</title>"
          }
      - name: Build mockagent (Rust)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\tmp | Out-Null
          cargo build --bin mockagent --locked
          Copy-Item target\debug\mockagent.exe C:\tmp\mockagent.exe -Force
          "LOCAL_AGENT_MOCKAGENT_BIN=C:\tmp\mockagent.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: cargo build
        run: cargo build --locked
      - name: cargo test
        run: cargo test --all-targets --locked

  # Native release artifact + real SPA embed + smoke (S-BUILD ACs).
  # Independent of debug build-macos / build-test-windows so those stay fast.
  release-linux:
    name: release + SPA smoke (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend (real SPA)
        working-directory: web
        run: |
          npm ci --quiet
          npm run build --silent
      - name: cargo build --release
        run: cargo build --release --locked --bin local_agent
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: local_agent-linux
          path: target/release/local_agent
          if-no-files-found: error
          retention-days: 14
      - name: SPA smoke
        run: bash scripts/spa-smoke.sh ./target/release/local_agent

  release-macos:
    name: release + SPA smoke (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend (real SPA)
        working-directory: web
        run: |
          npm ci --quiet
          npm run build --silent
      - name: cargo build --release
        run: cargo build --release --locked --bin local_agent
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: local_agent-macos
          path: target/release/local_agent
          if-no-files-found: error
          retention-days: 14
      - name: SPA smoke
        run: bash scripts/spa-smoke.sh ./target/release/local_agent

  release-windows:
    name: release + SPA smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend (real SPA)
        working-directory: web
        shell: pwsh
        run: |
          npm ci --quiet
          npm run build --silent
      - name: cargo build --release
        run: cargo build --release --locked --bin local_agent
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: local_agent-windows
          path: target/release/local_agent.exe
          if-no-files-found: error
          retention-days: 14
      - name: SPA smoke
        shell: pwsh
        run: pwsh -File scripts/spa-smoke.ps1 -Binary .\target\release\local_agent.exe
