[package]
name = "local_agent"
version = "0.1.0"
edition = "2021"
# MSRV — verified against installed stable 2025-12-08 (S-ARCH).
rust-version = "1.92.0"
description = "Self-hosted web code editor with AI built in (Rust port of the Go daemon)."
license = "AGPL-3.0"
publish = false
# Default binary is `local_agent` (mirrors Go `cmd/app`). The library target
# enables integration tests and contract fixtures to import internal modules.
default-run = "local_agent"

[lib]
name = "local_agent"
path = "src/lib.rs"

[[bin]]
name = "local_agent"
path = "src/main.rs"

[dependencies]
# --- Async runtime ---
# tokio: multi-threaded runtime maps to Go's GOMAXPROCS scheduler; required by
# axum, tower-http, and the ACP Rust SDK. Verified 2026-07-15.
tokio = { version = "1.47", features = ["full"] }
# tokio-util: CancellationToken replaces Go context.Context cancellation
# (data-and-concurrency.md). Verified 2026-07-15.
tokio-util = { version = "0.7.16", features = ["rt"] }

# --- Web framework ---
# axum: routing, middleware, and built-in WebSocket (replaces net/http +
# nhooyr.io/websocket). v0.8 line per web-framework.md. Verified 2026-07-15.
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
# tower: Service/Layer primitives consumed by axum middleware composition.
# Verified 2026-07-15.
tower = { version = "0.5", features = ["util"] }
# tower-http: CORS, limit, trace layers (replaces hand-rolled middleware).
# Verified 2026-07-15.
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
# tower_governor: IP-keyed rate limiting for unauthenticated endpoints (e.g.
# pairing). Recommended in web-framework.md over tower::limit::rate.
# Verified 2026-07-15.
tower_governor = "0.7"
# governor: the underlying rate-limit core. Imported directly for the
# `NoOpMiddleware` type alias used in our `IpGovernorLayer` type alias.
# Verified 2026-07-15.
governor = "0.8"

# --- TLS ---
# rustls: TLS serving path. aws-lc-rs provider chosen over ring because it is
# the rustls default provider, has FIPS validation path, and is recommended by
# the rustls maintainers for new deployments. Exactly one provider is installed
# at startup (src/app/tls.rs). TLS 1.3 only: the `tls12` feature is omitted so
# rustls refuses 1.2 handshakes, removing the older renegotiation/CBC surface.
# Verified 2026-07-15.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std"] }
# tokio-rustls: async TLS accept loop wrapper around rustls. Verified 2026-07-15.
tokio-rustls = "0.26"
# rcgen creates the daemon's ECDSA P-256 trust-on-first-use certificate; PEM
# files are persisted atomically under tlsCertDir. Verified 2026-07-17.
rcgen = { version = "0.14.8", default-features = false, features = ["aws_lc_rs", "pem"] }
# rustls-pemfile loads the generated cert/key into the tokio-rustls listener.
rustls-pemfile = "2.2.0"
# hyper-util adapts Axum's tower request service to TLS streams accepted by
# tokio-rustls. `axum-server` is deliberately not used (S-SERVER decision).
hyper-util = { version = "0.1.20", features = ["server-auto", "service", "tokio"] }
# hyper exposes the incoming request service type used by the dual listener.
hyper = "1.10.1"

# --- HTTP client ---
# reqwest: outbound HTTPS for ACP auth (PKCE) and agent provider callbacks.
# rustls-tls avoids pulling OpenSSL. Verified 2026-07-15.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# --- Serialization ---
# serde + serde_json: replaces encoding/json. Verified 2026-07-15.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# toml: replaces pelletier/go-toml/v2 for config files. Verified 2026-07-15.
toml = "0.8"

# --- Storage ---
# rusqlite (bundled): SQLite event store. Bundled feature compiles SQLite C
# source (needs cc at build time, no runtime dep). data-and-concurrency.md
# recommends rusqlite over sqlx for the append/query event store pattern.
# Verified 2026-07-15.
rusqlite = { version = "0.37", features = ["bundled"] }

# --- Logging / tracing ---
# tracing + tracing-subscriber: structured async-aware logging (replaces
# log/slog). Verified 2026-07-15.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# tracing-appender: non-blocking rolling file appender for ~/.local-agent/logs/
# (build-and-embed.md). Verified 2026-07-15.
tracing-appender = "0.2"

# --- CLI ---
# clap (derive): replaces spf13/cobra. Verified 2026-07-15.
clap = { version = "4.5", features = ["derive", "env"] }

# --- Error handling ---
# anyhow: ad-hoc error wrapping (Go fmt.Errorf %w). Verified 2026-07-15.
anyhow = "1.0"
# thiserror: typed domain errors. Verified 2026-07-15.
thiserror = "2.0"

# --- ACP SDK ---
# agent-client-protocol: official Rust ACP SDK (replaces coder/acp-go-sdk).
# v1.3.0 bumped from 1.2.0 on 2026-07-21. Default features cover the stable
# v1 protocol surface (initialize, session lifecycle, streaming, tool
# callbacks, permission requests). The `unstable_mcp_over_acp` feature is
# required to code-generate the mcp/connect / mcp/disconnect / mcp/message
# relay methods; `unstable` enables other draft operations used by the Go
# client (session fork, elicitation). MSRV 1.88.0 compatible.
#
# NOTE: 1.2.0 did NOT forward schema feature `unstable_llm_providers`, which
# required a direct agent-client-protocol-schema dep for Cargo feature
# unification. Check whether 1.3.0 forwards it; if so, the separate schema
# dep and the hand-rolled JsonRpcRequest types in src/acp/providers.rs can
# be removed (see S-ACP-SDK-BUMP story).
agent-client-protocol = { version = "1.3.0", features = ["unstable", "unstable_mcp_over_acp"] }
agent-client-protocol-schema = { version = "1.4.0", features = ["unstable_llm_providers"] }
# async-process owns ACP agent children while exposing futures-compatible stdio
# streams for the SDK's ByteStreams transport. Production ACP needs explicit
# cwd, stderr-tail, and child lifecycle control, which AcpAgent intentionally
# encapsulates.
async-process = "2.5.0"
# Used to drain the agent stderr pipe without blocking the bounded ACP actor.
futures-util = "0.3"

# --- Filesystem helpers ---
# dirs: cross-platform home_dir (passwd / Known Folder fallback when HOME is
# unset). Shared by config + logging via src/fsutil. Verified 2026-07-15.
dirs = "6.0.0"
# atomic-write-file: durable atomic writes (temp + fsync + rename). Shared
# helper in src/fsutil for config, MCP, conversation store, and other state
# files that must not be truncated on crash. Verified 2026-07-15.
atomic-write-file = "0.3.0"

# --- Shared interfaces (S-INTERFACES) ---
# async-trait: async methods on service traits (EventStore, WorkspaceManager, …)
# without boxing futures at every call site. Verified 2026-07-15.
async-trait = "0.1.89"
# chrono: DateTime<Utc> for event/session timestamps; serde feature matches Go
# time.Time RFC3339 JSON. Verified 2026-07-15.
chrono = { version = "0.4.45", features = ["serde"] }

# --- Filesystem watcher (S-FSWATCH) ---
# notify: cross-platform filesystem event watcher (replaces fsnotify/fsnotify).
# Verified 2026-07-15. See docs/rust-ecosystem/data-and-concurrency.md.
notify = "8.2.0"
# notify-debouncer-full: maintained debouncer that coalesces the OS-level event
# burst a single editor save produces (used instead of a hand-rolled sleep
# loop). The "full" variant preserves `EventKind` so Create events for newly
# created directories can be detected and watched recursively. Verified
# 2026-07-15.
notify-debouncer-full = "0.7.0"
# lru: bounded LRU cache for the app-write suppression and per-path emit
# throttle maps so they cannot grow unbounded between cleanup passes.
# Verified 2026-07-15.
lru = "0.18.1"
# infer: magic-byte MIME type detection for the upload store (replaces Go's
# net/http DetectContentType). Verified 2026-07-15.
infer = "0.22.0"
# uuid: v4 opaque upload IDs for the per-session upload store (S-UPLOADS).
# Verified 2026-07-15.
uuid = { version = "1.11", features = ["v4"] }
# libc: Unix process-group management (setpgid, killpg) for the shell executor's
# cancellation path. Verified 2026-07-15.
libc = "0.2.186"
# regex: pattern compilation for the workspace content-search fallback
# (S-SEARCH). Also a transitive dep of `ignore`; pinned as a direct dep so the
# fallback walker can compile user patterns. Verified 2026-07-16.
regex = "1.11"
# ignore: ripgrep's directory walker (BurntSushi/ripgrep) used by the
# content-search native fallback when `rg` is not on PATH. We configure it with
# the explicit ignore list only (no .gitignore) to match the Go fallback.
# Verified 2026-07-16.
ignore = "0.4.29"
dashmap = "6.2.1"
sha2 = "0.11.0"
qrcode = "0.14.1"
rand = "0.10.2"
hex = "0.4.3"
subtle = "2.6.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rust-embed = { version = "8.12.0", features = ["interpolate-folder-path"] }
# http-body exposes the body trait used to enforce request/response deadlines
# around Axum's type-erased Body. Verified 2026-07-17.
http-body = "1.1.0"

[target."cfg(windows)".dependencies]
# winreg implements the non-admin HKCU Run-key autostart path. It is compiled
# only for Windows, so Unix/macOS builds carry no registry dependency.
winreg = "0.56.0"

[features]
# `contract` enables the black-box contract differential runner
# (tests/contract_runner/). The runner boots a Go or Rust backend binary as a
# subprocess and requires Go to be installed, so it's gated behind a feature
# to keep `cargo test --all-targets` (and CI) fast and dependency-free.
# Run via: cargo test --test contract_runner --features contract
contract = []

[dev-dependencies]
# tempfile: scratch workspace dirs for S-PATHUTIL traversal/symlink tests and
# S-CONFIG atomic-write / round-trip tests so they never touch the developer's
# real filesystem. Verified 2026-07-15.
tempfile = "3.27.0"
# tokio test macro for async unit tests. Verified 2026-07-15.
tokio-test = "0.4"
# regex: redaction patterns for the contract differential runner
# (tests/contract_runner/). Mirrors the Go redactor in go-fixtures/redact.go.
# Verified 2026-07-16.
regex = "1.11"
# tokio-tungstenite: async WebSocket client for the contract runner's WS tests
# (origin rejection, auth success, event broadcast). Replaces nhooyr.io/websocket
# from the Go harness. Verified 2026-07-16.
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }

# Lint policy — authoritative levels enforced by `cargo build`/`cargo test`/
# `cargo clippy` and IDE check-on-save, not just by `cargo clippy -- -D warnings`.
# CI runs `cargo clippy --all-targets -- -D warnings`; the deny levels below stay
# consistent with that. Add new deny lints only after verifying the tree is clean.
[lints.rust]
# Parity with CI's `-D warnings`: any rustc warning is a build failure.
warnings = "deny"

[lints.clippy]
# Default group baseline (correctness + suspicious + style + complexity + perf).
all = "deny"
# Restriction lints — enforce daemon-grade discipline. This process serves the
# LAN and executes shell commands on behalf of agents, so panics and stray
# debug output are unacceptable in non-test code. All entries below were
# verified clean across `--all-targets` on 2026-07-15 before being denied.
dbg_macro = "deny"        # no `dbg!()` — use `tracing`
print_stdout = "deny"     # no `println!` — use `tracing`
print_stderr = "deny"     # no `eprintln!` — use `tracing`
todo = "deny"             # no shipped `todo!()` stubs
unimplemented = "deny"    # no `unimplemented!()`
panic = "deny"            # no `panic!()` — return `Result` instead
unwrap_used = "deny"      # no `.unwrap()` — can panic; use `?` or `let Ok(..) = ..`
expect_used = "deny"      # no `.expect()` — same rationale as `unwrap_used`

# Aspirational pedantic lints (missing_errors_doc, missing_panics_doc,
# must_use_candidate, doc_markdown) are NOT denied yet: 4 findings exist today
# (see docs/known-issues.md). Deny them once those are fixed. Adding them as
# `warn` here would be escalated to errors by CI's blanket `-D warnings`.

# Release binaries: strip symbols for smaller single-binary distribution
# (S-BUILD). Debug builds keep symbols for local development.
[profile.release]
strip = true
